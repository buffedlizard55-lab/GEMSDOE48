[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe48"
version = "0.1.0"
description = "Auditable Dempster-Shafer family fusion and validation for the DOE GEMS challenge"
requires-python = ">=3.11"
dependencies = [
  "affine>=2.4",
  "numpy>=1.24",
  "rasterio>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.8",
  "Markdown>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
