[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe48"
version = "0.1.0"
description = "Auditable conflict-aware evidence fusion for the DOE GEMS fault-mapping challenge"
requires-python = ">=3.10"
dependencies = [
  "affine>=2.4",
  "numpy>=1.24",
  "rasterio>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
