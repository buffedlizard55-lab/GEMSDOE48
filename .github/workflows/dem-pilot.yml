name: H50 DEM pilot (2 m copies of selected USGS 3DEP 1 m tiles)
# The development sandbox cannot reach USGS hosts, so a hosted runner downloads a few
# official 1 m tiles, block-averages them to 2 m and uploads them as a run artifact that
# the sandbox retrieves through the GitHub API. Manual dispatch only; nothing is committed.
on:
  workflow_dispatch:
    inputs:
      tiles:
        description: "Comma-separated tile ids from registry/dem_tiles_pilot.json"
        default: "x42y425,x30y436,x41y427,x35y444,x38y420,x40y427"
      res:
        description: "Output resolution in metres"
        default: "2"
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/dem-pilot.yml"
      - "scripts/dem_pilot_fetch.py"
permissions:
  contents: read
env:
  TILES: ${{ github.event.inputs.tiles || 'x42y425,x30y436,x41y427,x35y444,x38y420,x40y427' }}
  RES: ${{ github.event.inputs.res || '2' }}
jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[run-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 rasterio==1.4.4
      - name: Fetch and reduce tiles
        run: |
          free -g; nproc; df -h /tmp | tail -1
          python scripts/dem_pilot_fetch.py --tiles "$TILES" --res "$RES" --out scratch/dem_pilot || echo "one or more tiles failed (see receipt)"
          ls -la scratch/dem_pilot
      - uses: actions/upload-artifact@v4
        with:
          name: dem-pilot-${{ github.run_id }}
          path: scratch/dem_pilot/
          retention-days: 14
          compression-level: 0
