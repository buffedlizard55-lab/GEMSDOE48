name: ci

# Everything in this repository is reproducible offline from data/ alone, so CI
# runs the whole suite with no network access and no secrets.
#
# Deliberately absent: any step that fetches drivendata.org.  The competition's
# terms of use prohibit robots and automatic access (sibling irregularity
# IR-DRIVENDATA-AUTOMATION), and a past push-triggered run in this project did
# fetch the leaderboard.  The scripts in this repository refuse those hosts.

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "rasterio>=1.3" "scipy>=1.11"
      - name: Full suite
        run: python -m unittest discover -s tests -t tests
      - name: Rebuild the submission and assert the receipts are unchanged
        run: |
          python scripts/hash_inputs.py
          python scripts/build_submission.py
          python scripts/build_site.py
          git diff --exit-code registry/ docs/
